<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KaLLia - Smart Mirror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mirror-container">
    
    <!-- Header Superior (Info Vitais) -->
    <header class="mirror-header">
      <div class="clock-widget">
        <div class="time-display">
          <span id="clock-hours">18</span><span class="colon">:</span><span id="clock-minutes">45</span>
          <span id="clock-seconds" class="seconds-small">00</span>
        </div>
        <div id="date-display" class="date-display">Carregando data...</div>
      </div>

      <div class="system-widget">
        <div class="status-badge" id="status-badge">
          <span class="status-dot"></span>
          <span class="status-text">KaLLia Online</span>
        </div>
        <div class="hardware-info" id="hardware-info">
          <span id="temp-display" class="info-item">🌡️ --°C</span>
          <span id="ram-display" class="info-item">🧠 -- MB</span>
        </div>
      </div>
    </header>

    <!-- Centro (Área de Reflexo Limpa + Card de Conversação Interativo) -->
    <main class="mirror-center">
      <div id="interaction-card" class="interaction-card hidden">
        <div class="speaker-avatar">
          <div class="avatar-ring" id="avatar-ring"></div>
          <div class="avatar-core">K</div>
        </div>

        <div class="interaction-content">
          <div id="user-prompt" class="user-prompt hidden"></div>
          <div id="agent-response" class="agent-response">
            <span class="typing-placeholder">Como posso ser genial hoje?</span>
          </div>
        </div>

        <!-- Visualizador de Áudio da Voz -->
        <div class="waveform-container" id="waveform-container">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>
          <!-- Card de Carteira Rapida (Visual e Silencioso) -->
      <div id="wallet-card" class="wallet-card hidden">
        <div class="wallet-header">
          <div class="wallet-title">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <line x1="2" y1="10" x2="22" y2="10"></line>
            </svg>
            <span>Carteira do Mes</span>
          </div>
          <span id="wallet-period" class="wallet-period">09/2026</span>
        </div>

        <div class="wallet-balance-box">
          <span class="balance-label">Saldo Atual</span>
          <span id="wallet-saldo" class="balance-value">R$ 0,00</span>
        </div>

        <div class="wallet-grid">
          <div class="wallet-stat income">
            <span class="stat-label">Receitas</span>
            <span id="wallet-receita" class="stat-value">+ R$ 0,00</span>
          </div>
          <div class="wallet-stat expense">
            <span class="stat-label">Despesas</span>
            <span id="wallet-despesa" class="stat-value">- R$ 0,00</span>
          </div>
          <div class="wallet-stat card">
            <span class="stat-label">Cartao</span>
            <span id="wallet-cartao" class="stat-value">R$ 0,00</span>
          </div>
        </div>

        <div class="wallet-footer-hint">Toque para fechar • some automaticamente</div>
      </div>
    </main>

    <!-- Rodapé (Controles Touch) -->
    <footer class="mirror-footer">
      
      <!-- Botão Esquerdo: Resumo Rápido -->
      <div class="footer-left">
        <button id="btn-quick-saldo" class="icon-touch-btn" title="Resumo Financeiro">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
          </svg>
        </button>
      </div>

      <!-- Centro: Push-to-Talk Mic -->
      <div class="footer-center">
        <div class="ptt-wrapper">
          <div class="ptt-pulse-ring" id="ptt-pulse"></div>
          <button id="btn-ptt" class="btn-ptt" aria-label="Segure para Falar">
            <svg class="mic-icon" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
        </div>
        <div id="ptt-hint" class="ptt-hint">Segure para falar</div>
      </div>

      <!-- Botão Direito: Teclado Virtual / Digitação -->
      <div class="footer-right">
        <button id="btn-keyboard-toggle" class="icon-touch-btn" title="Digitar Mensagem">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <circle cx="6" cy="8" r="1"></circle>
            <circle cx="10" cy="8" r="1"></circle>
            <circle cx="14" cy="8" r="1"></circle>
            <circle cx="18" cy="8" r="1"></circle>
            <circle cx="6" cy="12" r="1"></circle>
            <circle cx="10" cy="12" r="1"></circle>
            <circle cx="14" cy="12" r="1"></circle>
            <circle cx="18" cy="12" r="1"></circle>
            <line x1="6" y1="16" x2="18" y2="16"></line>
          </svg>
        </button>
      </div>

    </footer>

    <!-- Gaveta / Modal de Digitação Retrátil -->
    <div id="keyboard-drawer" class="keyboard-drawer hidden">
      <div class="drawer-content">
        <input type="text" id="text-input" placeholder="Converse com a KaLLia..." autocomplete="off">
        <button id="btn-send-text" class="btn-send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
        <button id="btn-close-drawer" class="btn-close">&times;</button>
      </div>
    </div>

    <!-- Elemento Invisível para Reprodução de Áudio -->
    <audio id="audio-player" class="hidden"></audio>

  </div>

  <script src="app.js"></script>
</body>
</html>
